<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SusShare 共享板</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body class="h-dvh overflow-hidden bg-neutral-100 text-neutral-900 antialiased">
  <div id="auth-view" class="flex h-dvh items-center justify-center p-6" hidden>
    <main class="auth-panel">
      <h1 class="mb-6 text-center text-xl font-semibold text-neutral-900">SusShare 共享板</h1>
      <form id="login-form" class="grid gap-3">
        <label class="text-sm font-medium text-neutral-700" for="login-password">密码</label>
        <input id="login-password" name="password" type="password" class="field-input" autocomplete="current-password">
        <button id="login-button" class="primary-button mt-2" type="submit">登录</button>
        <p id="login-error" class="error" role="alert" hidden></p>
      </form>
    </main>
  </div>

  <div id="board-view" class="flex h-dvh flex-col" hidden>
    <header class="flex h-14 shrink-0 items-center justify-between border-b border-neutral-200 bg-white px-4 sm:px-6">
      <h1 class="m-0 text-lg font-semibold text-neutral-900">SusShare 共享板</h1>
      <div class="flex items-center gap-2">
        <button id="refresh-button" class="board-button" type="button">刷新</button>
        <button id="settings-button" class="board-button" type="button">设置</button>
        <button id="logout-button" class="board-button" type="button">退出</button>
      </div>
    </header>

    <main class="flex min-h-0 flex-1 flex-col">
      <section class="min-h-0 flex-1 overflow-y-auto px-4 py-4 sm:px-6" aria-labelledby="items-heading">
        <div class="mx-auto w-full max-w-3xl">
          <div class="mb-3 flex min-h-8 items-center justify-between gap-3">
            <h2 id="items-heading" class="m-0 text-base font-semibold text-neutral-900">共享内容</h2>
            <span id="refresh-state" class="text-xs text-neutral-500" aria-live="polite"></span>
          </div>
          <div id="items-list" class="grid gap-3"></div>
          <p id="empty-state" class="rounded-lg border border-dashed border-neutral-300 bg-white/60 px-4 py-8 text-center text-sm text-neutral-500" hidden>暂无共享内容</p>
        </div>
      </section>

      <section id="composer" class="composer shrink-0 border-t border-neutral-200 bg-white/95 px-4 py-3 sm:px-6" aria-label="发送内容">
        <div id="composer-resize" class="composer-resize" role="separator" tabindex="0" aria-orientation="horizontal" aria-controls="composer" aria-label="调整发送区高度"></div>
        <div class="composer-content mx-auto w-full max-w-3xl">
          <div class="composer-tabs mb-3 grid grid-cols-2 gap-2" role="tablist" aria-label="内容类型">
            <button id="text-mode" class="mode-button" type="button" role="tab" aria-selected="true" aria-controls="text-form">文本</button>
            <button id="file-mode" class="mode-button" type="button" role="tab" aria-selected="false" aria-controls="file-form">文件</button>
          </div>
          <form id="text-form" class="composer-form">
            <textarea id="text-content" class="composer-textarea" rows="5" placeholder="输入要共享的内容"></textarea>
            <button id="text-submit" class="primary-button justify-self-start px-8" type="submit">上传</button>
          </form>
          <form id="file-form" class="composer-form" hidden>
            <div class="composer-file-body">
              <label id="drop-zone" class="drop-zone" for="file-input" tabindex="0">
                <strong class="text-sm font-semibold text-neutral-700">拖拽文件到这里</strong>
                <span>或点击选择文件</span>
                <input id="file-input" type="file" multiple hidden>
              </label>
              <div id="selected-files" class="selected-files composer-file-list"></div>
            </div>
            <button id="file-submit" class="primary-button justify-self-start px-8" type="submit">上传</button>
          </form>
        </div>
      </section>
    </main>
  </div>

  <dialog id="preview-modal" class="modal" aria-labelledby="preview-title">
    <div class="modal-head">
      <h2 id="preview-title" class="modal-title"></h2>
      <button id="preview-close" class="secondary-button" type="button">关闭</button>
    </div>
    <div id="preview-body" class="grid gap-3"></div>
  </dialog>

  <dialog id="settings-modal" class="modal" aria-labelledby="settings-title">
    <div class="modal-head">
      <h2 id="settings-title" class="modal-title">设置</h2>
      <button id="settings-close" class="secondary-button" type="button">关闭</button>
    </div>
    <form id="settings-form" class="mb-5 grid gap-2">
      <label class="text-sm font-medium text-neutral-700" for="retention-select">保留时间</label>
      <select id="retention-select" class="field-input">
        <option value="1h">1 小时</option>
        <option value="6h">6 小时</option>
        <option value="12h">12 小时</option>
        <option value="24h">24 小时</option>
        <option value="72h">3 天</option>
        <option value="168h">7 天</option>
      </select>
      <button class="primary-button mt-2" type="submit">保存</button>
    </form>
    <form id="password-form" class="grid gap-2">
      <label class="text-sm font-medium text-neutral-700" for="current-password">当前密码</label>
      <input id="current-password" type="password" class="field-input" autocomplete="current-password">
      <label class="mt-2 text-sm font-medium text-neutral-700" for="new-password">新密码</label>
      <input id="new-password" type="password" class="field-input" autocomplete="new-password">
      <button class="primary-button mt-2" type="submit">修改密码</button>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=6" defer></script>
</body>
</html>
